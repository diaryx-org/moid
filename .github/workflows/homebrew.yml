name: Homebrew
# Release the `moid` CLI to Homebrew. The build/attach/render/push mechanics are
# shared with twig and fig and live in diaryx-org/.github; only what makes moid
# different is below.
#
# moid is a Rust workspace: the CLI is the `moid-cli` crate, whose binary is
# named `moid` — hence `cargo-package` and `name` differing. The aarch64-linux
# cross linker the cargo build needs is installed by the shared workflow.
#
# Prerequisite before the first tagged release succeeds: install the diaryx-bot
# GitHub App on diaryx-org/homebrew-tap (Contents:write) and add its App ID +
# private key as the TAP_APP_ID / TAP_APP_KEY secrets on this repo.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch:
permissions:
  contents: write # caps what the called workflow may request
jobs:
  homebrew:
    uses: diaryx-org/.github/.github/workflows/reusable-homebrew.yml@main
    with:
      name: moid
      desc: "Command-line companion for the moid opaque-ID minter"
      language: rust
      cargo-package: moid-cli
    secrets:
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
      TAP_APP_KEY: ${{ secrets.TAP_APP_KEY }}
